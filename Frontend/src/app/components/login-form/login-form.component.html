<mat-card>
  <mat-card-title class="title">Login</mat-card-title>
  <mat-card-content>
    <form [formGroup]="form">
      <p>
        <mat-form-field>
          <mat-label>Email</mat-label>
          <input type="text" matInput formControlName="email" />
          <mat-error *ngIf="form.get('email')?.hasError('required')">
            Email is required
          </mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">
            Email is invalid
          </mat-error>
        </mat-form-field>
      </p>

      <p>
        <mat-form-field>
          <mat-label>Password</mat-label>
          <input
            [type]="hidden ? 'password' : 'text'"
            matInput
            formControlName="password"
          />
          <button
            mat-icon-button
            matSuffix
            (click)="toggleHide()"
            [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="hidden"
          >
            <mat-icon>{{ hidden ? "visibility_off" : "visibility" }}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('password')?.hasError('required')">
            Password is required
          </mat-error>
        </mat-form-field>
      </p>
    </form>
  </mat-card-content>
  <mat-card-actions>
    <button
      mat-flat-button
      type="button"
      (click)="submit()"
      [disabled]="form.invalid"
    >
      Login
    </button>
    <a mat-button routerLink="/register">Don't have an account?</a>
  </mat-card-actions>
</mat-card>
