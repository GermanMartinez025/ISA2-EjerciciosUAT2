<mat-card class="card" appearance="outlined">
  <mat-card-header>
    <div mat-card-avatar>
      <mat-icon [matTooltip]="getDeviceLabel(device.deviceType)">
        {{ getDeviceIcon(device.deviceType) }}
      </mat-icon>
    </div>
    <mat-card-title>
      {{ device.name }}
    </mat-card-title>
    <mat-card-subtitle>
      {{ device.model }}
      @if (showCompany){ -
      {{ device.companyName }}
      }
    </mat-card-subtitle>
  </mat-card-header>
  <img
    mat-card-image
    style="width: 100%"
    [src]="device.photos"
    [alt]="device.name"
  />
  <mat-card-content>
    <div
      *ngIf="secondaryPhotos().length > 0"
      class="secondary-photos"
      (click)="showMorePhotos()"
    >
      <mat-icon> photo_library </mat-icon>
      <span>+ {{ secondaryPhotos().length }} photos</span>
    </div>
    <p>
      {{ device.description }}
    </p>
  </mat-card-content>
</mat-card>
