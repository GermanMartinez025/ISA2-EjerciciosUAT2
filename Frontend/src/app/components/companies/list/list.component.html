<app-filters [filters]="filters" (apply)="applyFilters()"></app-filters>
<div class="list">
  <app-company-summary
    *ngFor="let company of companies"
    [company]="company"
    class="no-padding"
  ></app-company-summary>
</div>
<mat-paginator
  [length]="totalCompanies"
  [pageSize]="pageOptions.size"
  [pageSizeOptions]="[5, 10, 25, 100]"
  aria-label="Select page"
  (page)="pageChange($event)"
>
</mat-paginator>
