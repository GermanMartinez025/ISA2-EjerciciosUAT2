<mat-card>
  <mat-card-title class="title">Create Company</mat-card-title>
  <mat-card-content>
    <form [formGroup]="form">
      <mat-grid-list cols="4" rowHeight="100px" gutterSize="24px">
        <mat-grid-tile [colspan]="2" [rowspan]="2">
          <img
            [src]="image$ | async"
            alt="Company"
            class="avatar"
            (click)="openDialogImage()"
          />
        </mat-grid-tile>
        <mat-grid-tile [colspan]="2" [rowspan]="1">
          <mat-form-field>
            <mat-label>Company name</mat-label>
            <input type="text" matInput formControlName="name" />
            <mat-error *ngIf="form.get('name')?.hasError('required')">
              Company name is required
            </mat-error>
          </mat-form-field>
        </mat-grid-tile>

        <mat-grid-tile [colspan]="2" [rowspan]="1">
          <mat-form-field>
            <mat-label>RUT</mat-label>
            <input type="text" matInput formControlName="rut" />
            <mat-error *ngIf="form.get('rut')?.hasError('rut')">
              Company RUT is required
            </mat-error>
          </mat-form-field>
        </mat-grid-tile>
      </mat-grid-list>
    </form>
  </mat-card-content>
  <mat-card-actions>
    <button
      mat-flat-button
      type="button"
      (click)="submit()"
      [disabled]="form.invalid"
    >
      Create
    </button>
  </mat-card-actions>
</mat-card>
