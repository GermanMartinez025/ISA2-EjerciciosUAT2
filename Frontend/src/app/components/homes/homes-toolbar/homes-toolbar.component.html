<mat-toolbar style="justify-content: space-between">
  <div class="select-home">
    <form class="example-form">
      <mat-form-field class="example-full-width">
        <mat-label>Home</mat-label>
        <input
          type="text"
          placeholder="Pick one"
          aria-label="Home"
          matInput
          [formControl]="formControl"
          [matAutocomplete]="auto"
        />
        <mat-autocomplete
          #auto="matAutocomplete"
          [displayWith]="homeToDisplay"
          (optionSelected)="homeSelected.emit($event.option.value)"
        >
          @for (home of homes; track home) {
          <mat-option [value]="home">
            {{ homeToDisplay(home) }}
          </mat-option>
          }
        </mat-autocomplete>
      </mat-form-field>
    </form>
  </div>
  <div class="actions">
    <button mat-flat-button color="primary" (click)="createHome()">
      <span>Create home</span>
      <mat-icon>add</mat-icon>
    </button>
  </div>
</mat-toolbar>
