<mat-card class="card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>
      {{ device.name }}
    </mat-card-title>
    <mat-card-subtitle>
      {{ device.modelNumber }}
    </mat-card-subtitle>
  </mat-card-header>
  <img
    mat-card-image
    style="width: 100%"
    [src]="device.mainPhoto"
    [alt]="device.name"
  />
  <mat-card-content>
    <div
      *ngIf="secondaryPhotos().length > 0"
      class="secondary-photos"
      (click)="showMorePhotos()"
    >
      <mat-icon> photo_library </mat-icon>
      <span>+ {{ secondaryPhotos().length }} photos</span>
    </div>
    <p>
      {{ device.state }}
    </p>
  </mat-card-content>
</mat-card>
