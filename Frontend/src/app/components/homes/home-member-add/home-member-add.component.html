<mat-card>
  <mat-card-title class="title"> Add member </mat-card-title>
  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field>
        <mat-label>Email</mat-label>
        <input
          type="text"
          matInput
          formControlName="email"
          placeholder="Email"
          required
        />
        <mat-error *ngIf="form.controls.email.hasError('required')">
          Email is required
        </mat-error>
        <mat-error *ngIf="form.controls.email.hasError('email')">
          Email is invalid
        </mat-error>
      </mat-form-field>
      <button
        mat-raised-button
        color="primary"
        (click)="addMember()"
        [disabled]="form.invalid"
      >
        Add
      </button>
    </form>
  </mat-card-content>
</mat-card>
