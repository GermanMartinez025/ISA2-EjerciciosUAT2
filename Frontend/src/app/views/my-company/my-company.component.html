<app-company-form
  *ngIf="!company"
  (created)="onCompanyCreated()"
></app-company-form>
<mat-tab-group *ngIf="company" class="company-tabs">
  <mat-tab label="Basic Info">
    <app-company-summary [company]="company"></app-company-summary>
  </mat-tab>
  <mat-tab label="Devices">
    <app-list
      [showCreateButton]="true"
      [showCompany]="false"
      [filters]="filters"
    ></app-list>
  </mat-tab>
</mat-tab-group>
