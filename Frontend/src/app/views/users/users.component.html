<app-filters
  [filters]="filters"
  (apply)="filterChange()"
  (create)="openDialog('create')"
></app-filters>
<app-list [users]="users" (deleteUser)="deleteUser($event)"></app-list>
<mat-paginator
  [length]="totalUsers"
  [pageSize]="pageOptions.size"
  [pageSizeOptions]="[5, 10, 25, 100]"
  aria-label="Select page"
  (page)="pageChange($event)"
>
</mat-paginator>
