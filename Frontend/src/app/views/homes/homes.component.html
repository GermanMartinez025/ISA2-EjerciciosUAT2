<div *ngIf="isHomeUser">
  <app-homes-toolbar
    [homes]="homes"
    (homeSelected)="selectedHome = $event"
  ></app-homes-toolbar>
  <div class="home-details">
    @if(selectedHome){
    <app-home-detail [home]="selectedHome"></app-home-detail>
    }@else{
    <span> Pick a home o create a new if you don't have one </span>
    }
  </div>
</div>
<div *ngIf="!isHomeUser">
  <button mat-raised-button color="primary" (click)="convertToHomeUser()">
    Convert to Home User
  </button>
</div>
